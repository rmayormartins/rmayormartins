name: Atualizar estatísticas GitHub

on:
  schedule:
    - cron: "0 6 * * *"   # Diariamente as 06:00 UTC (03:00 BRT)
  workflow_dispatch:        # Permite rodar manualmente em Actions > Run workflow
  push:
    branches: [main]
    paths:
      - generate_stats.py
      - generate_theme.py
      - .github/workflows/update_stats.yml

permissions:
  contents: write          # necessario para o commit/push do README e do painel

concurrency:
  group: update-stats      # evita duas execucoes simultaneas disputando o push
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Os scripts usam so a biblioteca padrao (sem pip install).
      # Identidade visual do README: hero, faixas de secao, paineis e cartoes.
      - name: Gerar identidade visual (assets estaticos)
        run: python generate_theme.py

      # Painel de telemetria, cartoes de repositorio e bloco do README.
      # O GITHUB_TOKEN tambem habilita a API GraphQL (mapa de contribuicoes).
      - name: Gerar painel e bloco de estatisticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Commit e push (se houver mudancas)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
          else
            git commit -m "chore(stats): atualiza My Stats Action [skip ci]"
            git push
          fi
