<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30" role="img" aria-labelledby="t d"><title id="t">MOST STARRED &amp; FORKED</title><desc id="d">MOST STARRED &amp; FORKED: all time</desc><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.h1{font-size:15px;font-weight:700;letter-spacing:2.4px;fill:#e6edf3;}
.h1d{font-size:15px;font-weight:400;letter-spacing:.5px;fill:#7d8da0;}
.hs{font-size:12px;letter-spacing:.8px;fill:#7d8da0;}
.hb{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#a8b6c5;}
.kl{font-size:11.5px;font-weight:600;letter-spacing:1px;fill:#7d8da0;}
.kv{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:600;fill:#e6edf3;}
.ku{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:500;fill:#a8b6c5;}
.ks{font-size:12px;fill:#a8b6c5;}
.pt{font-size:12.5px;font-weight:700;letter-spacing:1.8px;fill:#e6edf3;}
.pn{font-size:12px;fill:#7d8da0;}
.lb{font-size:12.5px;fill:#a8b6c5;}
