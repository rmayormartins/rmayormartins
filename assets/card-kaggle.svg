<svg xmlns="http://www.w3.org/2000/svg" width="430" height="92" viewBox="0 0 430 92" role="img" aria-labelledby="t d"><title id="t">Kaggle</title><desc id="d">Kaggle: Notebooks and datasets. Link: kaggle.com/rmayormartins</desc><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.h1{font-size:15px;font-weight:700;letter-spacing:2.4px;fill:#1d1f21;}
